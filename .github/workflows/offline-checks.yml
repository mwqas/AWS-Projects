name: Offline learning checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Run exercises without AWS
        run: python -m unittest discover -s agentcore-customer-support/companion/offline -p 'test_*.py' -v
      - name: Validate Python syntax and local documentation links
        run: python scripts/check_resources.py
