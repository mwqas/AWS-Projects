[project]
name = "csai"
version = "0.1.0"
description = "Customer support agent using Strands and Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "bedrock-agentcore>=1.4.1",
    "bedrock-agentcore-starter-toolkit>=0.3.0",
    "boto3>=1.42.0",
    "mcp>=1.26.0,<2",
    "chardet>=6.0.0.post1",
    "nest-asyncio>=1.6.0",
    "playwright>=1.58.0",
    "strands-agents>=1.28.0",
    "strands-agents-tools>=0.2.21",
    "urllib3>=2.6.3",
]
